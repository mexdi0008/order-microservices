# Database-per-service: each service owns its own PostgreSQL instance.
services:
  products-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: products
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  orders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  product-service:
    build:
      context: .
      args:
        SERVICE: product-service
    depends_on:
      products-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://products-db:5432/products
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8081"

  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    depends_on:
      orders-db:
        condition: service_healthy
      product-service:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://orders-db:5432/orders
      DB_PASSWORD: ${DB_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:8081
    ports:
      - "8082:8082"
